spring.application.name=clyvovet-web

# Datasource - H2 em memoria
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:clyvovetdb
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA - o schema e responsabilidade exclusiva do Flyway
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

# Formato ISO (yyyy-MM-dd) para binding de LocalDate nos formularios
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso

# Thymeleaf
spring.thymeleaf.cache=false

# Erros - paginas proprias em templates/error
server.error.whitelabel.enabled=false
server.error.include-message=never
