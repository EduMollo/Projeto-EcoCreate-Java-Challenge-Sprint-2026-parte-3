<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-clyvo">
	<div class="container">
		<a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-heart-pulse me-1"></i>ClyvoVet</a>
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
			aria-controls="menuPrincipal" aria-expanded="false" aria-label="Alternar menu">
			<span class="navbar-toggler-icon"></span>
		</button>

		<div class="collapse navbar-collapse" id="menuPrincipal" th:if="${usuarioLogado != null}">
			<ul class="navbar-nav me-auto">
				<li class="nav-item" th:if="${usuarioLogado.equipeClinica}">
					<a class="nav-link" th:href="@{/}"><i class="bi bi-speedometer2 me-1"></i>Início</a>
				</li>
				<li class="nav-item" th:if="${usuarioLogado.equipeClinica}">
					<a class="nav-link" th:href="@{/consultas}"><i class="bi bi-calendar-check me-1"></i>Consultas</a>
				</li>
				<li class="nav-item" th:if="${usuarioLogado.equipeClinica}">
					<a class="nav-link" th:href="@{/pets}"><i class="bi bi-github me-1"></i>Pets</a>
				</li>
				<li class="nav-item" th:if="${usuarioLogado.equipeClinica}">
					<a class="nav-link" th:href="@{/tutores}"><i class="bi bi-people me-1"></i>Tutores</a>
				</li>
				<li class="nav-item" th:if="${usuarioLogado.admin}">
					<a class="nav-link" th:href="@{/clinicas}"><i class="bi bi-hospital me-1"></i>Clínicas</a>
				</li>
				<li class="nav-item" th:if="${usuarioLogado.admin}">
					<a class="nav-link" th:href="@{/usuarios}"><i class="bi bi-person-gear me-1"></i>Usuários</a>
				</li>
				<li class="nav-item" th:if="${usuarioLogado.tutor}">
					<a class="nav-link" th:href="@{/meus-pets}"><i class="bi bi-house-heart me-1"></i>Meus pets</a>
				</li>
			</ul>

			<div class="d-flex align-items-center text-white gap-2">
				<i class="bi bi-person-circle"></i>
				<span th:text="${usuarioLogado.nomeExibicao}">Usuário</span>
				<span class="badge bg-light text-dark" th:text="${usuarioLogado.descricaoPerfis}">Perfil</span>
				<form th:action="@{/logout}" method="post" class="ms-2">
					<button type="submit" class="btn btn-outline-light btn-sm">
						<i class="bi bi-box-arrow-right me-1"></i>Sair
					</button>
				</form>
			</div>
		</div>
	</div>
</nav>

</body>
</html>
