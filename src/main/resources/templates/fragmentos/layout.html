<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(titulo, conteudo)">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:replace="${titulo}">ClyvoVet</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
	<link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">

	<nav th:replace="~{fragmentos/navbar :: navbar}"></nav>

	<main class="container py-4 flex-grow-1">
		<div th:replace="~{fragmentos/alertas :: alertas}"></div>
		<section th:replace="${conteudo}"></section>
	</main>

	<footer class="text-center text-secondary small py-3">
		ClyvoVet — Jornada contínua de saúde do pet · Java Advanced · FIAP 2026
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
