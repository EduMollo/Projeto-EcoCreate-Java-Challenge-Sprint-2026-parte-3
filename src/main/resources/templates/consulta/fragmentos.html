<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Agenda do dia + consultas agendadas não realizadas (compartilhado pelos painéis admin e veterinário) -->
<div th:fragment="agenda(agendaDoDia, naoRealizadas)" class="row g-3">
	<div class="col-lg-7">
		<div class="card shadow-sm h-100">
			<div class="card-header bg-white d-flex justify-content-between align-items-center">
				<strong><i class="bi bi-calendar-day me-1"></i>Agenda de hoje</strong>
				<span class="badge bg-primary" th:text="${#lists.size(agendaDoDia)}">0</span>
			</div>
			<div class="card-body p-0">
				<p class="text-secondary p-3 mb-0" th:if="${#lists.isEmpty(agendaDoDia)}">Nenhuma consulta aberta para hoje.</p>
				<table class="table table-hover mb-0" th:unless="${#lists.isEmpty(agendaDoDia)}">
					<thead class="table-light">
						<tr><th>Pet</th><th>Tutor</th><th>Tipo</th><th>Status</th><th></th></tr>
					</thead>
					<tbody>
						<tr th:each="consulta : ${agendaDoDia}">
							<td th:text="${consulta.pet.nome}">Pet</td>
							<td th:text="${consulta.pet.tutor.nome}">Tutor</td>
							<td th:text="${consulta.tipoConsulta.descricao}">Tipo</td>
							<td><span th:replace="~{consulta/fragmentos :: status(${consulta.status})}"></span></td>
							<td class="text-end">
								<a th:href="@{/consultas/{id}(id=${consulta.id})}" class="btn btn-sm btn-outline-primary">Abrir</a>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<div class="col-lg-5">
		<div class="card shadow-sm h-100 border-warning">
			<div class="card-header bg-white d-flex justify-content-between align-items-center">
				<strong><i class="bi bi-exclamation-circle me-1 text-warning"></i>Agendadas e não realizadas</strong>
				<span class="badge bg-warning text-dark" th:text="${#lists.size(naoRealizadas)}">0</span>
			</div>
			<div class="card-body p-0">
				<p class="text-secondary p-3 mb-0" th:if="${#lists.isEmpty(naoRealizadas)}">Nenhuma pendência.</p>
				<ul class="list-group list-group-flush" th:unless="${#lists.isEmpty(naoRealizadas)}">
					<li class="list-group-item d-flex justify-content-between align-items-center" th:each="consulta : ${naoRealizadas}">
						<div>
							<strong th:text="${consulta.pet.nome}">Pet</strong>
							<span class="text-secondary small">
								· <span th:text="${consulta.tipoConsulta.descricao}">Tipo</span>
								· <span th:text="${#temporals.format(consulta.dataConsulta, 'dd/MM/yyyy')}">Data</span>
							</span>
						</div>
						<a th:href="@{/consultas/{id}(id=${consulta.id})}" class="btn btn-sm btn-outline-secondary">Abrir</a>
					</li>
				</ul>
			</div>
		</div>
	</div>
</div>

<!-- Badge de status da consulta -->
<span th:fragment="status(status)" class="badge" th:classappend="'bg-' + ${status.corBootstrap}"
	th:text="${status.descricao}">Status</span>

</body>
</html>
