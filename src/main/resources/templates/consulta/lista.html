<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{fragmentos/layout :: layout(~{::title}, ~{::section})}">
<head>
	<title>Consultas — ClyvoVet</title>
</head>
<body>
<section>
	<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
		<h1 class="h3 mb-0">Consultas</h1>
		<a th:href="@{/consultas/nova}" class="btn btn-primary"><i class="bi bi-calendar-plus me-1"></i>Agendar consulta</a>
	</div>

	<ul class="nav nav-pills mb-3">
		<li class="nav-item">
			<a class="nav-link" th:classappend="${statusFiltro == null} ? 'active'" th:href="@{/consultas}">Todas</a>
		</li>
		<li class="nav-item" th:each="status : ${listaStatus}">
			<a class="nav-link" th:classappend="${statusFiltro == status} ? 'active'"
				th:href="@{/consultas(status=${status})}" th:text="${status.descricao}">Status</a>
		</li>
	</ul>

	<div class="card shadow-sm">
		<div class="table-responsive">
			<table class="table table-hover align-middle mb-0">
				<thead class="table-light">
					<tr><th>Data</th><th>Pet</th><th>Tutor</th><th>Tipo</th><th>Clínica</th><th>Veterinário</th><th>Status</th><th></th></tr>
				</thead>
				<tbody>
					<tr th:if="${#lists.isEmpty(consultas)}"><td colspan="8" class="text-secondary text-center py-4">Nenhuma consulta encontrada.</td></tr>
					<tr th:each="consulta : ${consultas}">
						<td th:text="${#temporals.format(consulta.dataConsulta, 'dd/MM/yyyy')}">Data</td>
						<td><a th:href="@{/pets/{id}(id=${consulta.pet.id})}" th:text="${consulta.pet.nome}" class="text-decoration-none">Pet</a></td>
						<td th:text="${consulta.pet.tutor.nome}">Tutor</td>
						<td th:text="${consulta.tipoConsulta.descricao}">Tipo</td>
						<td th:text="${consulta.clinica.nome}">Clínica</td>
						<td th:text="${consulta.veterinario}">Vet</td>
						<td><span th:replace="~{consulta/fragmentos :: status(${consulta.status})}"></span></td>
						<td class="text-end">
							<a th:href="@{/consultas/{id}(id=${consulta.id})}" class="btn btn-sm btn-outline-primary">Abrir</a>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</section>
</body>
</html>
