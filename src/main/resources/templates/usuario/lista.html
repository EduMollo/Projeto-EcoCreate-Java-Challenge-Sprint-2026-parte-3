<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{fragmentos/layout :: layout(~{::title}, ~{::section})}">
<head>
	<title>Usuários — ClyvoVet</title>
</head>
<body>
<section>
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h1 class="h3 mb-0">Usuários</h1>
		<a th:href="@{/usuarios/novo}" class="btn btn-primary"><i class="bi bi-person-plus me-1"></i>Novo usuário</a>
	</div>

	<div class="card shadow-sm">
		<div class="table-responsive">
			<table class="table table-hover align-middle mb-0">
				<thead class="table-light">
					<tr><th>Usuário</th><th>Nome</th><th>Perfil</th><th>Tutor vinculado</th><th>Criado em</th><th>Situação</th><th class="text-end">Ações</th></tr>
				</thead>
				<tbody>
					<tr th:each="usuario : ${usuarios}">
						<td><code th:text="${usuario.username}">username</code></td>
						<td th:text="${usuario.nomeExibicao}">Nome</td>
						<td>
							<span class="badge bg-primary me-1" th:each="perfil : ${usuario.perfis}" th:text="${perfil.descricao.descricao}">Perfil</span>
						</td>
						<td th:text="${usuario.tutor != null} ? ${usuario.tutor.nome} : '—'">Tutor</td>
						<td th:text="${#temporals.format(usuario.dataCriacao, 'dd/MM/yyyy')}">Data</td>
						<td>
							<span class="badge" th:classappend="${usuario.ativo} ? 'bg-success' : 'bg-secondary'"
								th:text="${usuario.ativo} ? 'Ativo' : 'Inativo'">Situação</span>
						</td>
						<td class="text-end acoes-tabela">
							<form th:action="@{/usuarios/{id}/alternar-ativo(id=${usuario.id})}" method="post"
								th:unless="${usuario.id == usuarioLogado.id}">
								<button type="submit" class="btn btn-sm btn-outline-secondary"
									th:text="${usuario.ativo} ? 'Desativar' : 'Reativar'">Desativar</button>
							</form>
							<span class="text-secondary small" th:if="${usuario.id == usuarioLogado.id}">você</span>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</section>
</body>
</html>
