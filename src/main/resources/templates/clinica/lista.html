<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{fragmentos/layout :: layout(~{::title}, ~{::section})}">
<head>
	<title>Clínicas — ClyvoVet</title>
</head>
<body>
<section>
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h1 class="h3 mb-0">Clínicas</h1>
		<a th:href="@{/clinicas/nova}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nova clínica</a>
	</div>

	<div class="card shadow-sm">
		<div class="table-responsive">
			<table class="table table-hover align-middle mb-0">
				<thead class="table-light">
					<tr><th>Nome</th><th>CNPJ</th><th>Cidade/UF</th><th>Telefone</th><th>Situação</th><th class="text-end">Ações</th></tr>
				</thead>
				<tbody>
					<tr th:if="${#lists.isEmpty(clinicas)}"><td colspan="6" class="text-secondary text-center py-4">Nenhuma clínica cadastrada.</td></tr>
					<tr th:each="clinica : ${clinicas}">
						<td th:text="${clinica.nome}">Nome</td>
						<td th:text="${clinica.cnpj}">CNPJ</td>
						<td th:text="${clinica.cidade + '/' + clinica.estado}">Cidade</td>
						<td th:text="${clinica.telefone}">Telefone</td>
						<td>
							<span class="badge" th:classappend="${clinica.ativo} ? 'bg-success' : 'bg-secondary'"
								th:text="${clinica.ativo} ? 'Ativa' : 'Inativa'">Situação</span>
						</td>
						<td class="text-end acoes-tabela">
							<a th:href="@{/clinicas/{id}/editar(id=${clinica.id})}" class="btn btn-sm btn-outline-primary">
								<i class="bi bi-pencil"></i> Editar
							</a>
							<form th:action="@{/clinicas/{id}/alternar-ativo(id=${clinica.id})}" method="post">
								<button type="submit" class="btn btn-sm btn-outline-secondary"
									th:text="${clinica.ativo} ? 'Inativar' : 'Reativar'">Inativar</button>
							</form>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</section>
</body>
</html>
