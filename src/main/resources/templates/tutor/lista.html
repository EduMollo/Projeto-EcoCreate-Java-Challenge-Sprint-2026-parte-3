<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{fragmentos/layout :: layout(~{::title}, ~{::section})}">
<head>
	<title>Tutores — ClyvoVet</title>
</head>
<body>
<section>
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h1 class="h3 mb-0">Tutores</h1>
		<a th:href="@{/tutores/novo}" class="btn btn-primary"><i class="bi bi-person-plus me-1"></i>Novo tutor</a>
	</div>

	<div class="card shadow-sm">
		<div class="table-responsive">
			<table class="table table-hover align-middle mb-0">
				<thead class="table-light">
					<tr><th>Nome</th><th>CPF</th><th>E-mail</th><th>Telefone</th><th>Situação</th><th class="text-end">Ações</th></tr>
				</thead>
				<tbody>
					<tr th:if="${#lists.isEmpty(tutores)}"><td colspan="6" class="text-secondary text-center py-4">Nenhum tutor cadastrado.</td></tr>
					<tr th:each="tutor : ${tutores}">
						<td th:text="${tutor.nome}">Nome</td>
						<td th:text="${tutor.cpf}">CPF</td>
						<td th:text="${tutor.email}">E-mail</td>
						<td th:text="${tutor.telefone}">Telefone</td>
						<td>
							<span class="badge" th:classappend="${tutor.ativo} ? 'bg-success' : 'bg-secondary'"
								th:text="${tutor.ativo} ? 'Ativo' : 'Inativo'">Situação</span>
						</td>
						<td class="text-end acoes-tabela">
							<a th:href="@{/tutores/{id}/editar(id=${tutor.id})}" class="btn btn-sm btn-outline-primary">
								<i class="bi bi-pencil"></i> Editar
							</a>
							<form th:action="@{/tutores/{id}/alternar-ativo(id=${tutor.id})}" method="post">
								<button type="submit" class="btn btn-sm btn-outline-secondary"
									th:text="${tutor.ativo} ? 'Inativar' : 'Reativar'">Inativar</button>
							</form>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</section>
</body>
</html>
