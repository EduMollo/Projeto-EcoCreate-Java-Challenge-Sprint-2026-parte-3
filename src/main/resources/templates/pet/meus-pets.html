<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{fragmentos/layout :: layout(~{::title}, ~{::section})}">
<head>
	<title>Meus pets — ClyvoVet</title>
</head>
<body>
<section>
	<h1 class="h3 mb-1">Meus pets</h1>
	<p class="text-secondary">Olá, <span th:text="${usuarioLogado.nomeExibicao}">Tutor</span>. Acompanhe a saúde dos seus companheiros.</p>

	<p class="text-secondary" th:if="${#lists.isEmpty(pets)}">Nenhum pet vinculado ao seu cadastro. Procure a clínica para atualizar seus dados.</p>

	<div class="row g-3">
		<div class="col-md-6 col-lg-4" th:each="pet : ${pets}">
			<div class="card shadow-sm h-100">
				<div class="card-body">
					<h2 class="h5 mb-1" th:text="${pet.nome}">Pet</h2>
					<div class="text-secondary small mb-3" th:text="${pet.especie.descricao + ' · ' + pet.raca + ' · ' + pet.idadeEmAnos + ' ano(s)'}">Espécie</div>
					<div class="small mb-3">
						<i class="bi bi-hospital me-1"></i>
						<span th:text="${pet.clinicaPrincipal != null} ? ${pet.clinicaPrincipal.nome} : 'Sem clínica principal'">Clínica</span>
					</div>
					<div class="d-flex gap-2">
						<a th:href="@{/pets/{id}/dashboard(id=${pet.id})}" class="btn btn-success btn-sm"><i class="bi bi-activity me-1"></i>Saúde</a>
						<a th:href="@{/pets/{id}(id=${pet.id})}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-card-list me-1"></i>Ficha</a>
						<a th:href="@{/pets/{id}/historico(id=${pet.id})}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-clock-history me-1"></i>Histórico</a>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
</body>
</html>
